<title>知识库目录树 · 结构编辑</title>
<style>
:root{
  --bg:#f4f6f9;--ink:#1b2430;--sub:#67737f;--line:#e4e8ee;
  --brand:#1f4e79;--brand2:#2c6ba3;--soft:#e9f1f9;--danger:#bb3a2c;--warn:#b8863b;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","Noto Sans SC",sans-serif;-webkit-font-smoothing:antialiased}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:230px}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1f4e79,#3179b5);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:1px;box-shadow:0 2px 6px rgba(31,78,121,.22)}
h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
.sub{margin:1px 0 0;font-size:11px;color:var(--sub)}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:6px;background:#f4f6f9;border:1px solid var(--line);border-radius:8px;padding:0 8px;height:32px;min-width:250px}
.search input{border:0;background:transparent;outline:none;font-size:13px;width:205px;font-family:inherit;color:var(--ink)}
.search:focus-within{border-color:#a7c2dd;background:#fff;box-shadow:0 0 0 3px rgba(44,107,163,.1)}
.search .clr{border:0;background:transparent;color:#9aa6b2;cursor:pointer;font-size:12px;display:none}
.btn{height:32px;padding:0 12px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#33414f;
  font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:inherit;transition:.15s}
.btn:hover{border-color:#bac8d7;background:#f7fafd;color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#173f63;color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.ghost:hover{background:#eff3f8;color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);
  background:#fff;font-size:12.5px;color:#33414f;cursor:pointer;font-family:inherit}
.chip.on{background:var(--soft);border-color:#cbdcEE;color:var(--brand)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#c3ccd6}
.chip.on .dot{background:var(--brand2)}
main{flex:1;display:flex;min-height:0}
#treeWrap{flex:1;overflow:auto;padding:8px 0 70px}
#tree{min-width:660px}
.node{display:flex;align-items:center;gap:6px;height:34px;padding-right:12px;border-bottom:1px solid #f1f4f8;
  cursor:default;position:relative;user-select:none}
.node:hover{background:#f7fafd}
.node.sel{background:var(--soft)}
.node.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
.node.dragging{opacity:.4}
.node.drop-before{box-shadow:inset 0 2px 0 var(--brand2)}
.node.drop-after{box-shadow:inset 0 -2px 0 var(--brand2)}
.node.drop-inside{background:#dceaf7}
#treeWrap.drop-tail{box-shadow:inset 0 0 0 2px #cbdcEE;background:#f3f8fd}
.ren{caret-color:var(--brand)}
.twist{flex:none;width:14px;text-align:center;color:#a6b2bf;font-size:10px;transition:transform .16s ease;cursor:pointer}
.twist.open{transform:rotate(90deg);color:var(--brand2)}
.twist.leaf{visibility:hidden}
.ico{flex:none;width:16px;height:16px}
.nm{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm.hit{background:#fff2bf;box-shadow:0 0 0 2px #fff2bf;border-radius:3px}
.ren{flex:1 1 auto;min-width:0;height:24px;border:1px solid var(--brand2);border-radius:5px;padding:0 6px;font:inherit;outline:none;color:var(--ink)}
.badge{flex:none;font-size:11px;color:#78838f;background:#f2f5f9;border-radius:10px;padding:1px 7px;white-space:nowrap}
.badge.empty{color:#a6b1bc}
.acts{flex:none;display:flex;gap:2px;margin-left:6px;opacity:0;transition:opacity .12s}
.node:hover .acts,.node.sel .acts{opacity:1}
.act{width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:#8d99a6;cursor:pointer;font-size:13px;line-height:1;padding:0}
.act:hover{background:#e4edf6;color:var(--brand)}
aside{flex:none;width:332px;background:#fff;border-left:1px solid var(--line);overflow:auto;padding:14px 14px 50px}
.pt{font-size:11px;letter-spacing:1.2px;color:var(--sub);margin:4px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.nd-name{font-size:15px;font-weight:600;line-height:1.45;word-break:break-all}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:9px;background:var(--soft);color:var(--brand);margin-top:7px}
.tag.file{background:#f3f5f8;color:#5d6a77}
.kv{display:flex;gap:8px;font-size:12px;margin-top:8px;color:#3f4d5b;line-height:1.5}
.kv b{color:var(--sub);font-weight:400;flex:none;width:48px}
.kv span{word-break:break-all}
.kv .num{color:var(--brand);font-weight:600}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.ops button{height:32px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12.5px;cursor:pointer;color:#33414f;font-family:inherit}
.ops button:hover{border-color:#bac8d7;background:#f7fafd;color:var(--brand)}
.ops button.danger{color:var(--danger);border-color:#efd8d4;background:#fdf8f7}
.ops button.danger:hover{background:#fbeeec;color:#9e2f23}
.ops button:disabled{opacity:.4;cursor:not-allowed;background:#fff}
.foot{flex:none;height:32px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#fff;border-top:1px solid var(--line);font-size:11.5px;color:var(--sub)}
#saveState.busy{color:var(--brand2)}
.hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 auto}
.ph{color:#95a1ad;font-size:12.5px;padding:6px 2px}
@media (max-width:880px){aside{display:none}.search{min-width:170px}.search input{width:130px}}
</style>

const LS_KEY = 'kb-tree-editor-1795567441900';
const MAX_HISTORY = 15;

let root = null;
let byId = new Map();
let parentMap = new Map();
let uidSeq = 0;
let expanded = new Set();
let selected = null;
let query = '';
let showFiles = true;
let saveTimer = null;
let history = [];
let dragUid = null;
let hoverEl = null;
let autoTimer = null;

const $ = s => document.querySelector(s);
const treeEl = $('#tree');
const wrapEl = $('#treeWrap');
const panelEl = $('#panel');

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s || '').toLowerCase(); }

function assignUid(n, p){
  byId.set(n._uid, n);
  parentMap.set(n._uid, p || null);
  (n.children || []).forEach(c => assignUid(c, n));
}
function ensureUid(n){
  if(!n._uid){ n._uid = ++uidSeq; }
  (n.children || []).forEach(ensureUid);
}
function reindex(){
  byId = new Map();
  parentMap = new Map();
  assignUid(root, null);
}
function statsOf(n, acc){
  acc = acc || {dirs:0, files:0};
  if(n.type === 'file'){ acc.files++; } else { acc.dirs++; }
  (n.children || []).forEach(c => statsOf(c, acc));
  return acc;
}
function maxDepthOf(n, d){
  d = d || 1;
  let max = d;
  (n.children || []).forEach(c => { max = Math.max(max, maxDepthOf(c, d + 1)); });
  return max;
}
function depthOf(n){
  let d = 0, p = parentMap.get(n._uid);
  while(p){ d++; p = parentMap.get(p._uid); }
  return d;
}
function pathOf(n){
  const names = [];
  let cur = n;
  while(cur){ names.unshift(cur.name); cur = parentMap.get(cur._uid); }
  return names.join(' / ');
}
function isDesc(a, b){
  let p = parentMap.get(a);
  while(p){ if(p._uid === b) return true; p = parentMap.get(p._uid); }
  return false;
}

function load(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); }catch(e){ saved = null; }
  if(saved && saved.tree && saved.tree.name){
    root = saved.tree;
    uidSeq = saved.uidSeq || 0;
    expanded = new Set(saved.expanded || []);
    selected = saved.selected || null;
    showFiles = saved.showFiles !== false;
  } else {
    root = JSON.parse(JSON.stringify(RAW_DATA));
    uidSeq = 0;
    expanded = new Set();
    selected = null;
    showFiles = true;
  }
  ensureUid(root);
  reindex();
  if(expanded.size === 0){
    expanded.add(root._uid);
    (root.children || []).forEach(c => expanded.add(c._uid));
  }
  if(!selected || !byId.has(selected)) selected = root._uid;
  $('#toggleFiles').classList.toggle('on', showFiles);
  if(statsOf(root).files === 0) $('#toggleFiles').style.display = 'none';
}

function save(immediate){
  const st = $('#saveState');
  st.textContent = '保存中…';
  st.classList.add('busy');
  const doSave = () => {
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({v:1, tree:root, expanded:[...expanded], selected, showFiles, uidSeq}));
      st.textContent = '已保存 ' + new Date().toLocaleTimeString('zh-CN', {hour12:false});
    }catch(e){
      st.textContent = '保存失败：本地存储已满';
    }
    st.classList.remove('busy');
  };
  clearTimeout(saveTimer);
  if(immediate) doSave(); else saveTimer = setTimeout(doSave, 600);
}

function pushHistory(){
  history.push(JSON.stringify(root));
  if(history.length > MAX_HISTORY) history.shift();
}

function badgeOf(n){
  if(n.type === 'file'){
    return n.size_text ? '<span class="badge">' + esc(n.size_text) + '</span>' : '';
  }
  const st = statsOf(n);
  const d = st.dirs - 1, f = st.files;
  if(!d && !f) return '<span class="badge empty">空</span>';
  return '<span class="badge">' + d + ' 目' + (f ? ' · ' + f + ' 文' : '') + '</span>';
}

function iconSvg(n, open){
  if(n.type === 'file'){
    const ext = String(n.name).split('.').pop().toLowerCase();
    let color = '#7b8794';
    if(ext === 'xlsx' || ext === 'xls') color = '#2f8f5b';
    else if(ext === 'docx' || ext === 'doc') color = '#2c6ba3';
    else if(ext === 'pdf') color = '#bb3a2c';
    else if(ext === 'pptx' || ext === 'ppt') color = '#b5651d';
    return '<svg class="ico" viewBox="0 0 16 16" style="color:' + color + '"><path d="M3.6 1.6h5.4l3.4 3.4v9.4H3.6z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M9 1.6v3.4h3.4" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>';
  }
  return '<svg class="ico" viewBox="0 0 16 16" style="color:' + (open ? '#2c6ba3' : '#95aabc') + '"><path d="M1.6 3.4h4.2l1.5 1.9h7.1v7.3H1.6z" fill="none" stroke="currentColor" stroke-width="1.45"/></svg>';
}

function rowHtml(n, depth, hit){
  const kids = (n.children || []).length;
  const hasKids = n.type !== 'file' && kids > 0;
  const open = query ? hasKids : expanded.has(n._uid);
  const cls = ['node'];
  if(selected === n._uid) cls.push('sel');
  return '<div class="' + cls.join(' ') + '" data-uid="' + n._uid + '" draggable="true" style="padding-left:' + (10 + depth * 18) + 'px">'
    + '<span class="twist' + (hasKids ? '' : ' leaf') + (open ? ' open' : '') + '" data-act="twist">▸</span>'
    + iconSvg(n, open)
    + '<span class="nm' + (hit ? ' hit' : '') + '">' + esc(n.name) + '</span>'
    + badgeOf(n)
    + '<span class="acts">'
    + '<button class="act" data-act="addChild" title="新增子级">＋</button>'
    + '<button class="act" data-act="rename" title="重命名（F2）">✎</button>'
    + '<button class="act" data-act="del" title="删除">✕</button>'
    + '</span></div>';
}

function buildKeep(){
  const keep = new Set();
  const q = norm(query);
  const dfs = n => {
    let hit = norm(n.name).indexOf(q) >= 0;
    (n.children || []).forEach(c => { if(dfs(c)) hit = true; });
    if(hit) keep.add(n._uid);
    return hit;
  };
  dfs(root);
  return keep;
}

function render(){
  const st = statsOf(root);
  $('#summary').textContent = st.files
    ? ('共 ' + (st.dirs + st.files).toLocaleString() + ' 项 · ' + st.dirs.toLocaleString() + ' 个目录 · ' + st.files.toLocaleString() + ' 份文件')
    : ('共 ' + st.dirs.toLocaleString() + ' 个目录');
  $('#depthInfo').textContent = '当前视图 ' + (query ? '搜索：' + query : (st.files && showFiles ? '含文件' : '仅目录')) + ' · 最深 ' + maxDepthOf(root) + ' 级';
  const keep = query ? buildKeep() : null;
  const rows = [];
  const walk = (n, depth) => {
    if(keep && !keep.has(n._uid)) return;
    if(!showFiles && n.type === 'file') return;
    rows.push(rowHtml(n, depth, keep ? norm(n.name).indexOf(norm(query)) >= 0 : false));
    const open = query ? true : expanded.has(n._uid);
    if(open && n.children && n.children.length) n.children.forEach(c => walk(c, depth + 1));
  };
  walk(root, 0);
  const keepScroll = wrapEl.scrollTop;
  treeEl.innerHTML = rows.join('');
  wrapEl.scrollTop = keepScroll;
  renderPanel();
}

function renderPanel(){
  const n = selected ? byId.get(selected) : null;
  if(!n){
    panelEl.innerHTML = '<div class="pt">节点详情</div><div class="card ph">在左侧选择一个节点</div>';

  }
  const isRoot = n === root;
  const p = parentMap.get(n._uid);
  const st = statsOf(n);
  const idx = p ? p.children.indexOf(n) : -1;
  const canUp = !isRoot && idx > 0;
  const canDown = !isRoot && p ? idx < p.children.length - 1 : false;
  const canIndent = !isRoot && p && idx > 0 && p.children[idx - 1].type !== 'file';
  const canOut = !isRoot && p && p !== root;
  let kv = '<div class="kv"><b>层级</b><span>第 ' + (depthOf(n) + 1) + ' 层</span></div>'
    + '<div class="kv"><b>路径</b><span>' + esc(pathOf(n)) + '</span></div>';
  if(n.type === 'file' && n.size_text) kv += '<div class="kv"><b>大小</b><span>' + esc(n.size_text) + '</span></div>';
  if(n.type === 'file' && n.uploader) kv += '<div class="kv"><b>来源</b><span>' + esc(n.uploader) + '</span></div>';
  if(n.type === 'file' && n.uploaded_at) kv += '<div class="kv"><b>时间</b><span>' + esc(n.uploaded_at) + '</span></div>';
  if(n.type !== 'file') kv += '<div class="kv"><b>下级</b><span><span class="num">' + ((n.children || []).length) + '</span> ' + (st.files ? ('项（目录 ' + (st.dirs - 1) + ' · 文件 ' + st.files + '）') : '个下级目录') + '</span></div>';
  panelEl.innerHTML = '<div class="pt">节点详情</div>'
    + '<div class="card"><div class="nd-name">' + esc(n.name) + '</div>'
    + '<span class="tag' + (n.type === 'file' ? ' file' : '') + '">' + (n.type === 'file' ? '文件' : '目录') + '</span>'
    + kv + '</div>'
    + '<div class="pt">调整结构</div>'
    + '<div class="card ops">'
    + '<button data-p="addChild">新增子级</button>'

    + '<button data-p="rename">重命名</button>'
    + '<button data-p="up"' + (canUp ? '' : ' disabled') + '>上移</button>'
    + '<button data-p="down"' + (canDown ? '' : ' disabled') + '>下移</button>'
    + '<button data-p="indent"' + (canIndent ? '' : ' disabled') + '>降级</button>'
    + '<button data-p="outdent"' + (canOut ? '' : ' disabled') + '>升级</button>'
    + '<button data-p="del" class="danger"' + (isRoot ? ' disabled' : '') + '>删除</button>'
    + '</div>';
}

function select(uid){
  selected = uid;
  save();
  render();
}
function toggle(uid){
  if(expanded.has(uid)) expanded.delete(uid); else expanded.add(uid);
  save();
  render();
}
function newNode(){
  uidSeq++;
  return {name:'新建目录', type:'dir', children:[], _uid:uidSeq};
}
function addChild(uid){
  const n = byId.get(uid);
  if(!n) return;
  if(n.type === 'file'){ alert('文件节点不能添加子级'); return; }
  pushHistory();
  const c = newNode();
  (n.children = n.children || []).push(c);
  expanded.add(uid);
  reindex();
  selected = c._uid;
  save(); render();
  startRename(c._uid);
}
function addSibling(uid){
  const n = byId.get(uid);
  if(!n || n === root){ alert('根节点不能新增同级'); return; }
  const p = parentMap.get(uid);
  if(!p) return;
  pushHistory();
  const c = newNode();
  const idx = p.children.indexOf(n);
  p.children.splice(idx + 1, 0, c);
  expanded.add(p._uid);
  reindex();
  selected = c._uid;
  save(); render();
  startRename(c._uid);
}
function delNode(uid){
  const n = byId.get(uid);
  if(!n || n === root){ alert('根节点不能删除'); return; }
  const st = statsOf(n);
  const total = st.dirs + st.files - (n.type === 'file' ? 1 : 0);
  const msg = '删除「' + n.name + '」' + (n.type === 'file' ? '？' : '及其下 ' + total + ' 项？');
  if(!confirm(msg)) return;
  const p = parentMap.get(uid);
  if(!p) return;
  pushHistory();
  const idx = p.children.indexOf(n);
  if(n.type === 'file'){
    p.children.splice(idx, 1);
  } else {
    p.children.splice(idx, 1);
  }
  selected = p._uid;
  reindex();
  save(); render();
}
function shift(uid, step){
  const n = byId.get(uid);
  const p = parentMap.get(uid);
  if(!n || !p) return;
  const idx = p.children.indexOf(n);
  const to = idx + step;
  if(to < 0 || to >= p.children.length) return;
  pushHistory();
  p.children.splice(idx, 1);
  p.children.splice(to, 0, n);
  save(); render();
}
function indentNode(uid){
  const n = byId.get(uid);
  const p = parentMap.get(uid);
  if(!n || !p) return;
  const idx = p.children.indexOf(n);
  if(idx <= 0) return;
  const prev = p.children[idx - 1];
  if(prev.type === 'file'){ alert('上级须为目录节点'); return; }
  pushHistory();
  p.children.splice(idx, 1);
  (prev.children = prev.children || []).push(n);
  expanded.add(prev._uid);
  reindex();
  save(); render();
}
function outdentNode(uid){
  const n = byId.get(uid);
  const p = parentMap.get(uid);
  if(!n || !p || p === root) return;
  const gp = parentMap.get(p._uid);
  if(!gp) return;
  pushHistory();
  p.children.splice(p.children.indexOf(n), 1);
  gp.children.splice(gp.children.indexOf(p) + 1, 0, n);
  expanded.add(gp._uid);
  reindex();
  save(); render();
}

let renamingUid = null;
function startRename(uid){
  const row = treeEl.querySelector('.node[data-uid="' + uid + '"]');
  if(!row) return;
  if(row.querySelector('input.ren')) return;
  const nm = row.querySelector('.nm');
  const node = byId.get(uid);
  if(!nm || !node) return;
  const old = node.name;
  const input = document.createElement('input');
  input.className = 'ren';
  input.type = 'text';
  input.value = old;
  input.spellcheck = false;
  row.draggable = false;
  nm.replaceWith(input);
  input.focus();
  input.setSelectionRange(0, String(old).length);
  renamingUid = uid;
  let done = false;
  ['click','mousedown','dblclick'].forEach(t => input.addEventListener(t, ev => ev.stopPropagation()));
  const commit = () => {
    if(done) return; done = true;
    const v = input.value.trim();
    if(v && v !== old){
      pushHistory();
      node.name = v;
      save();
    }
    renamingUid = null;
    render();
  };
  const cancel = () => { if(done) return; done = true; renamingUid = null; render(); };
  input.addEventListener('keydown', ev => {
    if(ev.isComposing) return;
    if(ev.key === 'Enter'){ ev.preventDefault(); commit(); }
    else if(ev.key === 'Escape'){ ev.preventDefault(); cancel(); }
    ev.stopPropagation();
  });
  input.addEventListener('blur', commit);
}

function undo(){
  if(!history.length) return;
  root = JSON.parse(history.pop());
  reindex();
  if(!byId.has(selected)) selected = root._uid;
  save(); render();
}

function pure(n, parentPath, isRoot){
  const o = {name:n.name, type:n.type};
  o.path = isRoot ? '' : (parentPath ? parentPath + '/' + n.name : n.name);
  if(n.size_text) o.size_text = n.size_text;
  const ch = (n.children || []).map(c => pure(c, o.path, false));
  if(n.type !== 'file'){
    o.dir_count = ch.filter(c => c.type !== 'file').length;
    o.file_count = ch.filter(c => c.type === 'file').length;
  }
  o.children = ch;
  return o;
}

function exportJson(){
  const clean = pure(root, '', true);
  const blob = new Blob([JSON.stringify(clean, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '知识库目录树_编辑版.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function saveHtml(){
  const data = pure(root, '', true);
  const dataTxt = JSON.stringify(data).replace(/</g, '\\u003c');
  const clone = document.documentElement.cloneNode(true);
  const t = clone.querySelector('#tree'); if(t) t.innerHTML = '';
  const p = clone.querySelector('#panel'); if(p) p.innerHTML = '';
  const q = clone.querySelector('#q'); if(q) q.value = '';
  const sv = clone.querySelector('#saveState'); if(sv) sv.textContent = '已保存';
  const stamp = Date.now();
  Array.from(clone.querySelectorAll('script')).forEach(sc => {
    const lines = sc.textContent.split('\n');
    const out = [];
    for(let i = 0; i < lines.length; i++){
      const ln = lines[i];
      if(ln.indexOf('const RAW_DATA = ') === 0) out.push('const RAW_DATA = ' + dataTxt + ';');
      else if(ln.indexOf('const LS_KEY = ') === 0) out.push("const LS_KEY = 'kb-tree-editor-" + stamp + "';");
      else out.push(ln);
    }
    sc.textContent = out.join('\n');
  });
  const html = '<!DOCTYPE html>\n' + clone.outerHTML;
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  const d = new Date();
  const fn = '知识库目录树_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.html';
  a.href = URL.createObjectURL(blob);
  a.download = fn;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  const st = $('#saveState');
  st.textContent = '已生成 ' + fn;
  setTimeout(() => save(true), 1400);
}

function importJson(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const data = JSON.parse(String(r.result));
      if(!data || !data.name || !Array.isArray(data.children)) throw new Error('结构不符');
      pushHistory();
      root = data;
      uidSeq = 0;
      expanded = new Set();
      selected = null;
      ensureUid(root);
      reindex();
      expanded.add(root._uid);
      (root.children || []).forEach(c => expanded.add(c._uid));
      selected = root._uid;
      save(true); render();
    }catch(e){
      alert('导入失败：不是有效的目录树 JSON');
    }
  };
  r.readAsText(file, 'utf-8');
}

function moveRel(srcUid, tgtUid, mode){
  if(srcUid === tgtUid) return;
  const src = byId.get(srcUid), tgt = byId.get(tgtUid);
  if(!src || !tgt) return;
  if(src === root) return;
  if(isDesc(tgtUid, srcUid)) return;
  const sp = parentMap.get(srcUid);
  if(!sp) return;
  pushHistory();
  sp.children.splice(sp.children.indexOf(src), 1);
  if(mode === 'inside'){
    if(tgt.type === 'file'){
      sp.children.push(src);
      reindex(); save(); render();
      return;
    }
    (tgt.children = tgt.children || []).push(src);
    expanded.add(tgtUid);
  } else {
    const tp = parentMap.get(tgtUid);
    if(!tp){ sp.children.push(src); reindex(); save(); render(); return; }
    const idx = tp.children.indexOf(tgt);
    tp.children.splice(mode === 'before' ? idx : idx + 1, 0, src);
    expanded.add(tp._uid);
  }
  reindex(); save(); render();
}

/* 树内交互 */
treeEl.addEventListener('click', e => {
  if(e.target && e.target.tagName === 'INPUT') return;
  const row = e.target.closest('.node');
  if(!row) return;
  const uid = +row.dataset.uid;
  const act = e.target.closest('[data-act]');
  if(act){
    e.stopPropagation();
    const a = act.dataset.act;
    if(a === 'twist') toggle(uid);
    else if(a === 'addChild') addChild(uid);
    else if(a === 'rename') startRename(uid);
    else if(a === 'del') delNode(uid);
    return;
  }
  select(uid);
});
treeEl.addEventListener('dblclick', e => {
  if(e.target && e.target.tagName === 'INPUT') return;
  const row = e.target.closest('.node');
  if(!row) return;
  if(e.target.closest('.act')) return;
  startRename(+row.dataset.uid);
});

/* 拖拽 */
treeEl.addEventListener('dragstart', e => {
  const row = e.target.closest('.node');
  if(!row) return;
  dragUid = +row.dataset.uid;
  row.classList.add('dragging');
  try{ e.dataTransfer.setData('text/plain', String(dragUid)); e.dataTransfer.effectAllowed = 'move'; }catch(err){}
});
treeEl.addEventListener('dragend', e => {
  const row = e.target.closest('.node');
  if(row) row.classList.remove('dragging');
  clearDrop();
  dragUid = null;
});
function clearDrop(){
  clearTimeout(autoTimer);
  wrapEl.classList.remove('drop-tail');
  if(hoverEl){ hoverEl.classList.remove('drop-before','drop-after','drop-inside'); delete hoverEl.dataset.drop; hoverEl = null; }
}
treeEl.addEventListener('dragover', e => {
  if(!dragUid) return;
  const row = e.target.closest('.node');
  if(!row) return;
  e.preventDefault();
  const tgtUid = +row.dataset.uid;
  if(tgtUid === dragUid || isDesc(tgtUid, dragUid)){ clearDrop(); return; }
  const tgt = byId.get(tgtUid);
  if(!tgt) return;
  const r = row.getBoundingClientRect();
  const y = e.clientY;
  let mode;
  if(tgt.type === 'file'){ mode = y < r.top + r.height / 2 ? 'before' : 'after'; }
  else { mode = y < r.top + r.height * 0.28 ? 'before' : (y > r.top + r.height * 0.72 ? 'after' : 'inside'); }
  if(hoverEl && hoverEl !== row) clearDrop();
  hoverEl = row;
  row.dataset.drop = mode;
  row.classList.remove('drop-before','drop-after','drop-inside');
  row.classList.add(mode === 'inside' ? 'drop-inside' : (mode === 'before' ? 'drop-before' : 'drop-after'));
  clearTimeout(autoTimer);
  if(mode === 'inside'){
    autoTimer = setTimeout(() => {
      if(dragUid && !expanded.has(tgtUid)){
        expanded.add(tgtUid);
        save();
        render();
      }
    }, 480);
  }
});
treeEl.addEventListener('drop', e => {
  e.preventDefault();
  const row = e.target.closest('.node');
  if(row && dragUid){
    const mode = row.dataset.drop;
    if(mode) moveRel(dragUid, +row.dataset.uid, mode);
  }
  clearDrop();
  dragUid = null;
});
wrapEl.addEventListener('dragover', e => {
  if(!dragUid) return;
  if(e.target.closest && e.target.closest('.node')) return;
  e.preventDefault();
  try{ e.dataTransfer.dropEffect = 'move'; }catch(err){}
  wrapEl.classList.add('drop-tail');
});
wrapEl.addEventListener('dragleave', e => {
  if(!e.relatedTarget || !wrapEl.contains(e.relatedTarget)) wrapEl.classList.remove('drop-tail');
});
wrapEl.addEventListener('drop', e => {
  wrapEl.classList.remove('drop-tail');
  if(!dragUid) return;
  if(e.target.closest && e.target.closest('.node')) return;
  e.preventDefault();
  const uid = dragUid;
  dragUid = null;
  moveRel(uid, root._uid, 'inside');
});

/* 面板按钮 */
panelEl.addEventListener('click', e => {
  const btn = e.target.closest('[data-p]');
  if(!btn) return;
  const a = btn.dataset.p;
  if(a === 'addChild') addChild(selected);
  else if(a === 'addSibling') addSibling(selected);
  else if(a === 'rename') startRename(selected);
  else if(a === 'up') shift(selected, -1);
  else if(a === 'down') shift(selected, 1);
  else if(a === 'indent') indentNode(selected);
  else if(a === 'outdent') outdentNode(selected);
  else if(a === 'del') delNode(selected);
});

/* 工具栏 */
$('#toggleFiles').onclick = () => {
  showFiles = !showFiles;
  $('#toggleFiles').classList.toggle('on', showFiles);
  save(); render();
};
let qTimer = null;
$('#q').addEventListener('input', e => {
  const v = e.target.value.trim();
  $('#qclr').style.display = v ? 'inline' : 'none';
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { query = v; render(); }, 120);
});
$('#qclr').onclick = () => {
  $('#q').value = ''; $('#qclr').style.display = 'none'; query = ''; render(); $('#q').focus();
};
$('#expandAll').onclick = () => {
  const addAll = n => { if(n.type !== 'file'){ expanded.add(n._uid); (n.children || []).forEach(addAll); } };
  addAll(root);
  save(); render();
};
$('#collapseAll').onclick = () => {
  expanded = new Set([root._uid]);
  save(); render();
};
$('#addRoot').onclick = () => {
  pushHistory();
  const c = newNode();
  (root.children = root.children || []).push(c);
  expanded.add(root._uid);
  reindex();
  selected = c._uid;
  save(); render();
  startRename(c._uid);
};
$('#importBtn').onclick = () => $('#fileInput').click();
$('#fileInput').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if(f) importJson(f);
  e.target.value = '';
});
$('#exportBtn').onclick = exportJson;
$('#saveHtmlBtn').onclick = saveHtml;
$('#resetBtn').onclick = () => {
  if(!confirm('恢复为导入时的原始目录树？当前编辑内容将丢失。')) return;
  localStorage.removeItem(LS_KEY);
  root = JSON.parse(JSON.stringify(RAW_DATA));
  uidSeq = 0;
  ensureUid(root);
  reindex();
  expanded = new Set([root._uid]);
  (root.children || []).forEach(c => expanded.add(c._uid));
  selected = root._uid;
  history = [];
  save(true); render();
};

/* 快捷键 */
window.addEventListener('keydown', e => {
  const tag = (e.target && e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea') return;
  if(e.ctrlKey && e.key.toLowerCase() === 'z'){ e.preventDefault(); undo(); }
  else if(e.ctrlKey && e.key.toLowerCase() === 's'){ e.preventDefault(); save(true); }
  else if(e.key === 'F2'){ e.preventDefault(); if(selected) startRename(selected); }
  else if(e.key === 'Delete'){ e.preventDefault(); if(selected) delNode(selected); }
});

load();
render();
</script>
